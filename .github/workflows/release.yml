name: Release

# Everything after `git push origin vX.Y.Z` is automated. The tag is the
# trigger because it is the one step that has to be a deliberate human act:
# `main` is protected, so the version bump arrives as a PR like anything else,
# and tagging is how you say "that one".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, and move `stable`
  id-token: write # prove to Sigstore which workflow is signing
  attestations: write # store the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the ancestry check below needs to see main.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: the tag must match the version in the code
        # Otherwise `woswoar --version` reports something other than the
        # release it came from, and the tag is the only thing anyone checks.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import woswoar; print(woswoar.__version__)')"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, woswoar/__init__.py says $code"
            exit 1
          fi
          echo "releasing $code"

      - name: the tag must be on main
        # `stable` is only meaningful if it can only ever point at something
        # that went through the protected branch, with its checks.
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; releases are cut from main only"
            exit 1
          fi

      - name: install age and fzf
        # The sync suite skips itself without age, and a skipped suite is green
        # -- so prove age is here rather than assume the install worked.
        #
        # fzf for a different reason: the suite does not skip without it, it
        # takes a *different branch* -- `setup` asks an extra question when a
        # tool is missing. CI installs both, this installed only age, and the
        # two therefore ran different code. That difference is what failed a
        # release after every check on the pull request was green.
        #
        # fzf comes from upstream rather than apt, for the reason `ci.yml`
        # spells out: ubuntu-latest ships 0.44.1, one release below
        # `search.TRANSFORM_SINCE`, and the tests that drive a real picker have
        # nothing to drive on it. Keep the pin here in step with that one.
        env:
          FZF_VERSION: 0.74.2
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          age --version
          curl -fsSL -o /tmp/fzf.tar.gz \
            "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz"
          sudo tar -xzf /tmp/fzf.tar.gz -C /usr/local/bin fzf
          fzf --version

      - name: tests
        # A tag can be pushed to any commit by anyone. Re-running the suite here
        # costs half a minute and means a release is never cut from something
        # that was not tested at this exact commit.
        run: python -m unittest discover -s . -t . -p 'test_*.py'

      - name: build
        run: |
          python -m pip install --quiet build
          python -m build
          # A second copy under a fixed name, so this URL is stable across
          # releases and can be pasted once:
          #   pipx install "woswoar @ https://github.com/martinus/woswoar/releases/latest/download/woswoar.tar.gz"
          # A wheel or sdist filename has to encode the version, so the normal
          # artefacts cannot serve that; a PEP 508 direct reference supplies the
          # project name instead, which is what makes the arbitrary name legal.
          #
          # Beside `dist/` rather than in it, and that is load-bearing now: the
          # PyPI upload takes a whole directory, and a filename without a
          # version in it is not a distribution name PyPI will accept. One
          # stray file would fail the publish of an otherwise good release.
          mkdir -p alias
          cp dist/woswoar-*.tar.gz alias/woswoar.tar.gz

      - name: attest what was built
        # Binds each artefact to this repository, this workflow file and this
        # commit, signed via Sigstore with the run's own OIDC identity -- no
        # key exists that could be lost or stolen. Anyone can then check a
        # downloaded file with
        #   gh attestation verify woswoar.tar.gz --repo martinus/woswoar
        # which turns "this tarball came from the audited release pipeline"
        # from a claim into something docs/verify.md can tell people to run.
        # Before `publish`, so nothing unattested is ever offered for download.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
            alias/*

      - name: publish to PyPI
        # Trusted Publishing (OIDC), not an API token, and not a preference:
        # `docs/security.md` claims a supply chain with no long-lived secret in
        # it, and a token in repository secrets is a credential that can be
        # stolen and used to publish a release nobody tagged. The run proves who
        # it is with the same short-lived identity that signs the attestation
        # above -- which is why `id-token: write` is already at the top of this
        # file. PyPI is told which repository and which *workflow file* to
        # trust, so a publish from anywhere else is refused rather than believed.
        #
        # Here rather than after the GitHub release, because this is the only
        # irreversible step in the file: a version number can be yanked but
        # never reused. Everything downstream of it can be re-run.
        #
        # `skip-existing` is what makes that re-run work. If `gh release create`
        # or the `stable` push fails, the fix is to re-run the job -- and
        # without this it would die on "file already exists" at the one step
        # that had actually succeeded.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/* alias/woswoar.tar.gz

      - name: move stable to this release
        # The install line in the README is `@stable`, so this is what makes it
        # mean "the latest release" without anyone editing a version number on
        # five machines. Deliberately not forced: if this is not a
        # fast-forward -- tagging an older commit, say -- the push fails and the
        # release stays where it is rather than silently going backwards.
        run: git push origin "$GITHUB_SHA:refs/heads/stable"
