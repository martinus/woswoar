name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: error::DeprecationWarning

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No `cache: pip` here: it was tried and measured, and it made this job
      # slower -- 13s to 17s. The dev deps are floors rather than pins, so pip
      # still pays a resolution round-trip on a hit, and the cache only saves
      # the wheel downloads, which cost less than restoring and saving it.
      #
      # shellcheck comes from pip rather than apt so the version CI enforces is
      # the same one `pip install -e .[dev]` gives you locally.
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy woswoar tests tools
      - run: shellcheck --shell=bash woswoar/shell/woswoar.bash
      # shellcheck has no zsh mode -- it refuses the dialect outright rather
      # than checking what it can -- so the zsh hook gets the only static check
      # zsh itself offers. Said here rather than left as a silent gap: `zsh -n`
      # is a parse, not a lint, and nothing below this line is checking the zsh
      # hook for the class of thing shellcheck finds in the bash one.
      - run: sudo apt-get install -y -qq zsh || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
      - run: zsh -n woswoar/shell/woswoar.zsh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install age
        # Sync tests skip themselves without age, and a silently skipped suite
        # looks exactly like a passing one.
        #
        # `update` only when the direct install misses: refreshing the lists
        # costs ~10s and the runner image usually already has what age needs,
        # which on the critical path is most of the job. The fallback keeps it
        # correct on an image where that stops being true.
        run: |
          sudo apt-get install -y -qq age \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
      - name: install fzf
        # **Not apt.** ubuntu-latest ships fzf 0.44.1, which is one release
        # below `search.TRANSFORM_SINCE` -- so on the runner woswoar correctly
        # withholds ctrl-r cycling, the ctrl-t timeline and the ctrl-/ pane, and
        # every test whose subject is one of those has nothing to drive. They
        # cannot skip themselves out of it either: the `--no-skips` step below
        # makes a skipped `test_search` fatal, deliberately.
        #
        # Pinned rather than "latest", so a release upstream cannot turn a green
        # branch red overnight. Bumping it is a normal change; the floor that
        # must hold is `search.TRANSFORM_SINCE`, asserted here so a wrong or
        # silently-downgraded install fails loudly instead of skipping.
        env:
          FZF_VERSION: 0.74.2
        run: |
          curl -fsSL -o /tmp/fzf.tar.gz \
            "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-linux_amd64.tar.gz"
          sudo tar -xzf /tmp/fzf.tar.gz -C /usr/local/bin fzf
          fzf --version
          python -c "
          import sys
          sys.path.insert(0, '.')
          from woswoar import search
          got = search.fzf_version()[1]
          floor = search.TRANSFORM_SINCE
          assert got is not None and got >= floor, f'fzf {got} is below {floor}'
          "
      - name: ssh-keygen is present
        # Signing needs it. Present on ubuntu-latest, asserted rather than
        # assumed for the same reason as bash below: a silently skipped suite
        # looks exactly like a passing one.
        run: ssh-keygen -Y sign -h 2>&1 | head -1; command -v ssh-keygen
      - name: bash version
        # The hook needs bash 5 for $EPOCHSECONDS / $EPOCHREALTIME. ubuntu-latest
        # ships it, but fail loudly rather than silently skipping the hook tests.
        run: |
          bash -c 'echo "bash ${BASH_VERSION}"'
          bash -c '((BASH_VERSINFO[0] >= 5))' || { echo "bash 5.0+ required"; exit 1; }
      # Sharded across processes: the suite is ~88% subprocess wait, so this is
      # 38s -> ~13s. The runner fails the build if any discovered test did not
      # report, which a plain `unittest discover` cannot get wrong but a
      # parallel runner can. No --no-skips here: strace is not installed in this
      # job, so the fork-scaling tests legitimately skip. The `hook` job is
      # where they are made fatal.
      - run: python -m tools.run_tests
      # The ranking tests are the one part of the suite whose subject is fzf's
      # behaviour rather than woswoar's, so they cannot be asserted against a
      # stand-in and they skip themselves when fzf is missing. fzf is installed
      # above, so here a skip means the install stopped working -- and a green
      # run that ranked nothing at all is exactly the failure worth catching.
      - run: python -m tools.run_tests --only tests.test_search --no-skips

  hook:
    # Called on every prompt, so the hook gets its own job: the fork-scaling
    # check needs strace, and a regression here is felt on every command.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install strace, zsh and locales
        # zsh is not on ubuntu-latest by default, and the zsh suite skips itself
        # without it -- which under `--no-skips` below is fatal rather than a
        # green run that measured nothing. That is the property this job exists
        # for, so it stays that way.
        run: |
          sudo apt-get install -y -qq strace zsh locales \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq strace zsh locales; }
          # The comma-decimal test needs a locale where $EPOCHREALTIME uses ","
          sudo locale-gen de_AT.UTF-8
          zsh --version
      # --jobs 1 on purpose: this job counts forks under strace, and the whole
      # point of it is a measurement that concurrent load has no say in. The
      # runner is used anyway for --no-skips -- strace and bash 5 are installed
      # here, so a skip means one of them stopped working, not that the test is
      # inapplicable.
      - run: python -m tools.run_tests --only tests.test_shell_hook --jobs 1 --no-skips
      # A second invocation rather than one over both: `--only` selects by
      # module or class prefix, and `tests.test_shell_hook` does not prefix
      # `tests.test_shell_hook_zsh` -- the dot is what separates them.
      - run: python -m tools.run_tests --only tests.test_shell_hook_zsh --jobs 1 --no-skips

  sync:
    # Two machines exchanging encrypted history through a bare repo, plus the
    # invariant the storage design rests on: chunks are never rewritten.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -qq age \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
      - run: age --version && git --version && command -v ssh-keygen
      - name: sync suite
        # These tests skip themselves when age or git is absent. A skipped run
        # is green, which is precisely the failure mode worth guarding, so
        # --no-skips makes any skip fatal here. It replaces a grep over the
        # summary line, which had to dodge the word "skipped" appearing in a
        # test docstring; the runner counts the skips themselves instead.
        run: python -m tools.run_tests --only tests.test_sync --no-skips

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: latency on a 52k-entry history
        env:
          WOSWOAR_BENCH: "1"
        # Prints the measured numbers and fails only on a large regression, so a
        # noisy shared runner cannot redden the build on its own. --jobs 1 for
        # the same reason: these are latency measurements, and running them
        # beside each other would be the noise they are trying to survive.
        #
        # --no-skips is the point of routing this through the runner: these
        # tests skip themselves unless WOSWOAR_BENCH is set, so if the env block
        # above ever stopped taking effect this job would go green having
        # measured nothing at all.
        run: python -m tools.run_tests --only tests.test_perf --jobs 1 --no-skips

  install:
    # Proves the packaging works and the documented first-run flow succeeds on a
    # machine that has never seen woswoar before.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: build the artefacts a release would publish, and install one
        # `pip install .` was already a wheel install -- pip builds one and
        # installs that -- so this is not about the install path. It is about
        # the two files themselves, now that a release uploads them somewhere a
        # version can be yanked but never reused.
        #
        # `python -m build` is the guard that earns its place: it rejects a
        # classifier PyPI does not recognise, and a `[project.urls]` table
        # written above `dependencies` rather than below it -- both of which
        # this diff got wrong on the way in, and neither of which any other job
        # here would have noticed. `twine check` is the cheaper half, the same
        # look twine takes immediately before an upload.
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*
          pip install dist/*.whl

      - name: first-run flow
        run: |
          set -euxo pipefail
          export HOME="$(mktemp -d)"
          printf '#1753000000\ngit status\n#1753000100\nninja -C build\n' > "$HOME/.bash_history"
          touch "$HOME/.bashrc"

          woswoar --version
          woswoar install
          woswoar import bash
          woswoar stats

          # The hook ships inside the wheel, so it must be present after a
          # plain `pip install .` with no source tree in sight.
          test -f "$HOME/.local/share/woswoar/woswoar.bash"
          grep -q 'woswoar' "$HOME/.bashrc"

          # Recording is end-to-end here: a real bash sources the installed hook
          # and the command must come back out of `woswoar list`.
          bash --norc -i <<'EOF'
          source "$HOME/.local/share/woswoar/woswoar.bash"
          echo ci-end-to-end-marker
          EOF
          woswoar list --scope global | grep -q 'ci-end-to-end-marker'

          # doctor exits non-zero on a broken install; fzf is absent here, so
          # only check that it runs and reports.
          woswoar doctor || true

      - name: two machines sync through a bare repo, from the installed wheel
        run: |
          set -euxo pipefail
          sudo apt-get install -y -qq age \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
          BASE="$(mktemp -d)"
          git init --quiet --bare "$BASE/origin.git"

          run_as() {          # run_as <machine> <args...>
            local m="$1"; shift
            env HOME="$BASE/$m" \
                WOSWOAR_DIR="$BASE/$m/data" \
                XDG_CONFIG_HOME="$BASE/$m/conf" \
                XDG_CACHE_HOME="$BASE/$m/cache" \
                woswoar "$@"
          }
          mkdir -p "$BASE"/{alpha,beta}/{data,conf,cache}

          run_as alpha init "$BASE/origin.git" --new-identity
          ALPHA_ID=$(grep '^id=' "$BASE/alpha/conf/woswoar/machine" | cut -d= -f2)
          mkdir -p "$BASE/alpha/data/logs/hosts/$ALPHA_ID"
          printf '1700000001\ts1\t~/src\t0\t5\tsecret-marker-command\n' \
            > "$BASE/alpha/data/logs/hosts/$ALPHA_ID/2023-11-14.tsv"
          run_as alpha sync

          # Nothing readable may reach the repo.
          ! grep -rq 'secret-marker-command' "$BASE/origin.git"

          run_as beta init "$BASE/origin.git" --new-identity
          run_as alpha sync
          # --yes because there is no terminal here; grant refuses to widen
          # who can read the history on an assumed answer.
          run_as alpha grant --yes
          run_as alpha sync
          run_as beta sync
          run_as beta list --scope global | grep -q 'secret-marker-command'

          # The point of the signature: a chunk none of these machines put its
          # name to is refused. Sealed to alpha's published day key, which is in
          # the clear on purpose, so this is exactly what push access alone can
          # build -- and it is a perfectly well-formed chunk. What the attacker
          # cannot do is get it into a manifest alpha signed.
          ATTACK="$BASE/attacker"
          # --no-local for the same reason `init` uses it: a local clone reads
          # the origin's object store through a directory listing that nothing
          # holds still. How the attacker got its copy is beside the point of
          # this test, and a flake here would look like a security failure.
          git clone --quiet --no-local "$BASE/origin.git" "$ATTACK"
          DAY_PUB=$(cat "$ATTACK/hosts/$ALPHA_ID/keys/2023-11-14.pub")
          printf '1700000009\ts1\t~\t0\t5\tforged-marker-command\n' \
            | python3 -c 'import sys; from woswoar import sync; sys.stdout.buffer.write(sync.pack(sys.stdin.buffer.read()))' \
            | age -r "$DAY_PUB" \
            > "$ATTACK/hosts/$ALPHA_ID/2023-11-14/9999999999-ffffff.age"
          git -C "$ATTACK" add -A
          git -C "$ATTACK" -c user.name=x -c user.email=x@y commit -q -m 'woswoar sync'
          git -C "$ATTACK" push --quiet origin HEAD

          run_as beta sync
          ! run_as beta list --scope global | grep -q 'forged-marker-command'

          # The other direction, which is the ceremony this design costs: alpha
          # cloned before beta existed, so it has never been told to accept
          # beta. Its history is refused until a human at alpha says otherwise.
          BETA_ID=$(grep '^id=' "$BASE/beta/conf/woswoar/machine" | cut -d= -f2)
          mkdir -p "$BASE/beta/data/logs/hosts/$BETA_ID"
          printf '1700000100\ts1\t~\t0\t5\tbeta-marker-command\n' \
            > "$BASE/beta/data/logs/hosts/$BETA_ID/2023-11-14.tsv"
          run_as beta sync
          run_as alpha sync
          ! run_as alpha list --scope global | grep -q 'beta-marker-command'

          run_as alpha trust --yes
          run_as alpha sync
          run_as alpha list --scope global | grep -q 'beta-marker-command'
