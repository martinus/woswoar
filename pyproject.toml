[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "woswoar"
# Read from woswoar/__init__.py rather than repeated here. Two declarations can
# disagree, and when they do `woswoar --version` lies about what is installed --
# which matters most during a release, when it is the only thing anyone checks.
dynamic = ["version"]
description = "Distributed shell history over git, searched with fzf"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Martin Leitner-Ankerl", email = "martin.ankerl@gmail.com" }]
keywords = ["shell", "history", "fzf", "git", "bash"]

# What a PyPI project page shows beside the README, and the only place a
# stranger can find the repository from an index listing.
#
# No `License ::` classifier: `license = "Apache-2.0"` above is the SPDX
# expression PEP 639 replaced it with, and declaring both is how a build starts
# failing on a future packaging release.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]

# Deliberately empty, and intended to stay that way: woswoar is standard library
# only. fzf is required at runtime as the UI, age only for `woswoar sync`.
dependencies = []

[project.optional-dependencies]
# Floors, not pins -- but recent ones. `ruff format --check` is a *formatter*
# gate, and its output changes between versions, so a floor three years behind
# lets a contributor pass locally and fail in CI for no reason they can see.
# These are the versions the suite is actually run against.
dev = ["ruff>=0.16", "mypy>=2.3", "shellcheck-py>=0.11"]

[project.scripts]
woswoar = "woswoar.__main__:main"

# Below every plain key of `[project]`, not beside `classifiers` where it reads
# better: a TOML sub-table ends its parent, so `[project.urls]` up there quietly
# swallows `dependencies` and the rest into itself. The build fails with "URL
# `dependencies` must be a string", which does not sound like a misplaced
# heading.
[project.urls]
Homepage = "https://github.com/martinus/woswoar"
Source = "https://github.com/martinus/woswoar"
Issues = "https://github.com/martinus/woswoar/issues"
Changelog = "https://github.com/martinus/woswoar/releases"

[tool.hatch.version]
path = "woswoar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["woswoar"]

[tool.hatch.build.targets.sdist]
include = ["woswoar", "tests", "tools", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Recent ruff formats fenced code blocks inside markdown; the design document
# contains illustrative snippets that are not meant to be valid modules.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
